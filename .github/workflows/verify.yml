name: Verify Skill contracts and asset diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run contracts without optional image dependencies
        run: python -B -m unittest discover -s tests -v
      - name: Check packaged installation and references
        run: python -B scripts/doctor.py
  png-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Provide optional PNG inspection dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Run Alpha, geometry, diagnostic preview and no-write regression checks
        run: python -B -m unittest discover -s tests -v
      - name: Check installation with optional image dependency available
        run: python -B scripts/doctor.py
  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: node --check website/illustration.js
      - name: Check exported browser brief and organization profile contracts
        run: node tests/web-contract.cjs
